<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OH stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .out-of-stock-wrapper { position: relative; }
        .out-of-stock-wrapper.sold-out::after {
            content: "ของหมด";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: rgba(239, 68, 68, 0.7);
            background-color: rgba(254, 242, 242, 0.8);
            border-radius: 0.75rem;
            pointer-events: none;
            letter-spacing: 0.05em;
            transform: rotate(-5deg);
        }
        .dark .out-of-stock-wrapper.sold-out::after {
            background-color: rgba(3, 7, 18, 0.85);
            color: rgba(248, 113, 113, 0.8);
        }
        @keyframes popGreen {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .pop-animation { animation: popGreen 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 pb-28 transition-colors duration-300">

    <!-- Header ไม่ค้าง (ปลดล็อค sticky ออกแล้ว) -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-xs transition-colors duration-300">
        <div class="max-w-2xl mx-auto px-4 py-3 space-y-3">
            
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🧋</span>
                    <h1 class="font-semibold text-base text-slate-900 dark:text-white">OH stock</h1>
                    <span id="syncStatus" class="text-[10px] text-amber-600 bg-amber-50 dark:bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800">⏳ กำลังเชื่อมต่อ...</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                        <button id="btnDaily" onclick="switchMode('daily')" class="px-3 py-1 text-xs font-medium rounded-lg bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-xs transition">Daily</button>
                        <button id="btnWeekly" onclick="switchMode('weekly')" class="px-3 py-1 text-xs font-medium rounded-lg text-slate-500 dark:text-slate-400 transition">Weekly</button>
                    </div>

                    <button onclick="toggleDarkMode()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 p-2 rounded-xl text-xs transition" title="สลับโหมดสว่าง/มืด">
                        <span id="themeIcon">🌙</span>
                    </button>
                </div>
            </div>

            <div class="space-y-2 pt-1 border-t border-slate-100 dark:border-slate-800">
                <div class="flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs">
                        <span class="text-slate-500 dark:text-slate-400">📊 สถานะ:</span>
                        <span class="font-bold text-emerald-600 dark:text-emerald-400">เสร็จ: <span id="countDone">0</span></span>
                        <span class="text-slate-300 dark:text-slate-700">|</span>
                        <span class="font-bold text-slate-700 dark:text-slate-300">ทั้งหมด: <span id="countTotal">0</span></span>
                        <span class="text-slate-300 dark:text-slate-700">|</span>
                        <span class="font-bold text-amber-600 dark:text-amber-400">รอนับ: <span id="countPending">0</span></span>
                    </div>
                </div>

                <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 ค้นหารหัส หรือ ชื่อสินค้า..." 
                    class="w-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none transition">
                
                <div class="flex gap-1.5">
                    <button id="filterAll" onclick="setFilter('all')" class="flex-1 py-1.5 text-xs rounded-xl border bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium">ทั้งหมด</button>
                    <button id="filterPending" onclick="setFilter('pending')" class="flex-1 py-1.5 text-xs rounded-xl border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800">⏳ รอนับ</button>
                    <button id="filterDone" onclick="setFilter('done')" class="flex-1 py-1.5 text-xs rounded-xl border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800">✅ เสร็จแล้ว</button>
                </div>

                <div id="categoryContainer" class="flex gap-1.5 overflow-x-auto pb-1 text-xs"></div>
            </div>

        </div>
        
        <div class="bg-slate-200 dark:bg-slate-800 h-1.5 w-full">
            <div id="progressBar" class="bg-emerald-500 h-1.5 transition-all duration-500" style="width: 0%"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">

        <!-- ปุ่มแอคชันหลัก จัดตรงกลาง แบบน่ารักสวยงาม -->
        <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl shadow-xs border border-slate-200/80 dark:border-slate-800 space-y-2 text-center">
            <div class="grid grid-cols-3 gap-2">
                <button onclick="fetchFromSheetsAndSyncFirebase()" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200/60 dark:border-slate-700/60 transition group active:scale-95">
                    <span class="text-base mb-1 group-hover:rotate-180 transition duration-500">🔄</span>
                    <span class="text-[11px] font-medium leading-tight">ดึงสินค้า Sheets</span>
                </button>
                
                <button onclick="submitToGoogleSheets()" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/80 transition active:scale-95">
                    <span class="text-base mb-1">📤</span>
                    <span class="text-[11px] font-medium leading-tight">ส่งเข้าระบบ</span>
                </button>
                
                <button onclick="startNewDay()" class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 dark:hover:bg-amber-900/50 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/80 transition active:scale-95">
                    <span class="text-base mb-1">🌅</span>
                    <span class="text-[11px] font-medium leading-tight">เริ่มรอบวันใหม่</span>
                </button>
            </div>
        </div>

        <div id="stockList" class="space-y-3"></div>

    </main>

    <!-- Modal เครื่องคิดเลข -->
    <div id="calcModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-4 w-72">
            <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-100 dark:border-slate-800">
                <span class="text-xs font-semibold text-slate-700 dark:text-slate-200" id="calcTitle">เครื่องคิดเลขเศษ</span>
                <button onclick="closeCalculator()" class="text-slate-400 hover:text-slate-600 text-xs font-bold p-1">✕</button>
            </div>
            <input type="text" id="calcDisplay" readonly class="w-full bg-slate-50 dark:bg-slate-950 text-right p-2 rounded-xl text-lg font-mono mb-3 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100" value="0">
            <div class="grid grid-cols-4 gap-1.5 text-sm">
                <button onclick="calcClear()" class="bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 p-2 rounded-xl font-medium">C</button>
                <button onclick="calcAppend('/')" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl">÷</button>
                <button onclick="calcAppend('*')" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl">×</button>
                <button onclick="calcBack()" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl">⌫</button>
                <button onclick="calcAppend('7')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">7</button>
                <button onclick="calcAppend('8')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">8</button>
                <button onclick="calcAppend('9')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">9</button>
                <button onclick="calcAppend('-')" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl">-</button>
                <button onclick="calcAppend('4')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">4</button>
                <button onclick="calcAppend('5')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">5</button>
                <button onclick="calcAppend('6')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">6</button>
                <button onclick="calcAppend('+')" class="bg-slate-100 dark:bg-slate-800 p-2 rounded-xl">+</button>
                <button onclick="calcAppend('1')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">1</button>
                <button onclick="calcAppend('2')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">2</button>
                <button onclick="calcAppend('3')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">3</button>
                <button onclick="calcApply()" class="row-span-2 bg-emerald-600 text-white rounded-xl font-medium flex items-center justify-center text-xs shadow-sm">ตกลง</button>
                <button onclick="calcAppend('0')" class="col-span-2 bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">0</button>
                <button onclick="calcAppend('.')" class="bg-slate-50 dark:bg-slate-950 p-2 rounded-xl">.</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRQW8NeX4P4VjDLFrjZXx8S8XOyA47I58",
            authDomain: "oj-stock-a6af4.firebaseapp.com",
            databaseURL: "https://oj-stock-a6af4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oj-stock-a6af4",
            storageBucket: "oj-stock-a6af4.firebasestorage.app",
            messagingSenderId: "916746183266",
            appId: "1:916746183266:web:85325fdf4e87313db6673b",
            measurementId: "G-LTGJR4QFW5"
        };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHaL8Ec89aJuRAnxtkFDZMKLOjBE3zeKCqXOOOOxo-VIAR3OWNDt2RLs4o4G4tAb8/exec";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentMode = 'daily';
        let currentFilter = 'all';
        let selectedCategory = 'ทั้งหมด';
        let activeInputId = null;
        let lastCompletedCount = 0;
        let stockItems = [];

        const statusEl = document.getElementById("syncStatus");

        function listenToFirebase() {
            const stockRef = ref(db, `stock_${currentMode}`);
            onValue(stockRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    stockItems = Array.isArray(data) ? data : Object.values(data);
                    statusEl.innerText = "🟢 Realtime Sync";
                    statusEl.className = "text-[10px] text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800";
                } else {
                    fetchFromSheetsAndSyncFirebase(true);
                }
                renderCategories();
                renderList();
            }, (error) => {
                console.error("Firebase Read Error:", error);
                statusEl.innerText = "❌ หลุดเชื่อมต่อ";
                statusEl.className = "text-[10px] text-rose-600 bg-rose-50 dark:bg-rose-950/60 px-2 py-0.5 rounded-full border border-rose-200 dark:border-rose-800";
            });
        }

        window.fetchFromSheetsAndSyncFirebase = async function(isInitial = false) {
            if (!isInitial && !confirm("🔄 ต้องการอัปเดตรายการสินค้าจาก Google Sheets ใช่หรือไม่?")) return;

            statusEl.innerText = "🔄 กำลังโหลด...";
            try {
                const response = await fetch(`${WEB_APP_URL}?mode=${currentMode}`);
                const rawData = await response.json();

                if (Array.isArray(rawData) && rawData.length > 0) {
                    const formattedData = rawData.map(item => {
                        item.count_type = item.count_type ? item.count_type.toString().trim().toLowerCase() : 'both';
                        if (!item.today) item.today = { full: "", frac1: "", frac2: "" };
                        return item;
                    });
                    
                    await set(ref(db, `stock_${currentMode}`), formattedData);
                    if (!isInitial) alert("✅ อัปเดตรายการสินค้าจาก Sheets เรียบร้อยแล้ว!");
                }
            } catch (err) {
                console.error(err);
                alert("❌ เกิดข้อผิดพลาดในการดึงข้อมูลจาก Sheets");
            }
        };

        window.switchMode = function(mode) {
            currentMode = mode;
            selectedCategory = 'ทั้งหมด';
            document.getElementById('btnDaily').className = mode === 'daily' ? 'px-3 py-1 text-xs font-medium rounded-lg bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-lg text-slate-500 dark:text-slate-400 transition';
            document.getElementById('btnWeekly').className = mode === 'weekly' ? 'px-3 py-1 text-xs font-medium rounded-lg bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-lg text-slate-500 dark:text-slate-400 transition';
            listenToFirebase();
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'pending', 'done'].forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1)}`);
                if (f === filter) {
                    btn.className = "flex-1 py-1.5 text-xs rounded-xl border bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs rounded-xl border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800";
                }
            });
            renderList();
        };

        function getStatusType(item) {
            if (!item || !item.today) return 'empty';
            const f = item.today.full;
            const f1 = item.today.frac1;
            const f2 = item.today.frac2;
            let type = item.count_type || 'both';

            const hasFull = f !== "" && f !== null && f !== undefined;
            const hasFrac1 = f1 !== "" && f1 !== null && f1 !== undefined;
            const hasFrac2 = f2 !== "" && f2 !== null && f2 !== undefined;
            const hasAnyInput = hasFull || hasFrac1 || hasFrac2;

            if (!hasAnyInput) return 'empty'; 

            if (type === 'full') return hasFull ? 'done' : 'incomplete';
            if (type === 'frac') return hasFrac1 ? 'done' : 'incomplete';
            if (type === 'frac2') return (hasFrac1 && hasFrac2) ? 'done' : 'incomplete';
            
            if (type === 'both') {
                if (hasFull && (hasFrac1 || hasFrac2)) return 'done';
                return 'incomplete';
            }
            return 'incomplete';
        }

        function updateProgressAndUI() {
            if (stockItems.length === 0) return;

            const total = stockItems.length;
            const completed = stockItems.filter(i => getStatusType(i) === 'done').length;
            const pending = total - completed;
            const percent = Math.round((completed / total) * 100);

            document.getElementById("progressBar").style.width = `${percent}%`;
            document.getElementById("countDone").innerText = completed;
            document.getElementById("countTotal").innerText = total;
            document.getElementById("countPending").innerText = pending;

            if (percent === 100 && lastCompletedCount < total) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
            lastCompletedCount = completed;
        }

        function renderCategories() {
            const container = document.getElementById("categoryContainer");
            if (!container) return;
            container.innerHTML = "";
            const categories = ["ทั้งหมด", ...new Set(stockItems.map(i => i.category))];

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-3 py-1.5 rounded-xl border text-xs whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-800 dark:border-slate-200 font-medium' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`;
                btn.innerText = cat;
                btn.onclick = () => { selectedCategory = cat; renderCategories(); renderList(); };
                container.appendChild(btn);
            });
        }

        window.renderList = function() {
            const container = document.getElementById("stockList");
            if (!container) return;
            container.innerHTML = "";
            const searchVal = document.getElementById("searchInput")?.value.toLowerCase() || "";

            let items = stockItems.filter(item => {
                const matchCategory = selectedCategory === 'ทั้งหมด' || item.category === selectedCategory;
                const matchSearch = item.id.toLowerCase().includes(searchVal) || item.name.toLowerCase().includes(searchVal);
                if (!matchCategory || !matchSearch) return false;
                
                const status = getStatusType(item);
                if (currentFilter === 'pending') return status === 'empty' || status === 'incomplete';
                if (currentFilter === 'done') return status === 'done';
                return true;
            });

            updateProgressAndUI();

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">ไม่พบรายการสินค้า</div>`;
                return;
            }

            items.forEach((item) => {
                const originalIdx = stockItems.indexOf(item);
                let cleanType = item.count_type || 'both';
                
                const fFullVal = item.today?.full !== "" && item.today?.full !== null ? item.today?.full : 0;
                const f1Val = parseFloat(item.today?.frac1) || 0;
                
                let f2Val = parseFloat(item.today?.frac2) || 0;
                let finalFrac2 = f2Val - (item.tare || 0);
                if (finalFrac2 < 0) finalFrac2 = 0;

                const totalFrac = f1Val + finalFrac2;
                const status = getStatusType(item);

                const isZeroAll = (item.today?.full === 0 || item.today?.full === "0") && 
                                  (item.today?.frac1 === 0 || item.today?.frac1 === "0") && 
                                  (item.today?.frac2 === 0 || item.today?.frac2 === "0");

                let cardBg = 'bg-white dark:bg-slate-900 border-slate-200/80 dark:border-slate-800';
                let badgeClass = 'text-slate-400 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700';
                let badgeText = '⏳ รอนับ';

                if (status === 'incomplete') {
                    cardBg = 'bg-amber-50/40 dark:bg-amber-950/20 border-amber-200 dark:border-amber-800/50';
                    badgeClass = 'text-amber-700 dark:text-amber-400 bg-amber-100 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800';
                    badgeText = '⏳ ยังไม่ครบ';
                } else if (status === 'done') {
                    cardBg = 'bg-emerald-50/60 dark:bg-emerald-950/25 border-emerald-300 dark:border-emerald-800';
                    badgeClass = 'text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-800 font-semibold';
                    badgeText = '✅ เสร็จแล้ว';
                }

                let typeLabel = "นับเต็ม";
                if (cleanType === 'frac') typeLabel = "นับเศษ";
                else if (cleanType === 'frac2') typeLabel = "นับเศษ (2 ช่อง)";
                else typeLabel = "นับเต็ม+เศษ";

                const card = document.createElement("div");
                card.id = `card_${originalIdx}`;
                card.className = `p-3.5 sm:p-4 rounded-2xl border transition duration-200 shadow-xs ${cardBg}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2.5">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-mono text-[10px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded-md">${item.id}</span>
                                <span class="text-[10px] text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/50 px-1.5 py-0.5 rounded-md border border-indigo-100 dark:border-indigo-900">📌 ${typeLabel}</span>
                                ${item.tare > 0 ? `<span class="text-[10px] text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50 px-1.5 py-0.5 rounded-md border border-rose-100 dark:border-rose-900">✂️ -${item.tare}</span>` : ''}
                                <span class="text-[10px] text-slate-400 bg-slate-50 dark:bg-slate-800/50 px-1.5 py-0.5 rounded-md">${item.category}</span>
                            </div>
                            <h2 class="text-xs sm:text-sm font-medium text-slate-900 dark:text-white mt-1 leading-snug">${item.name} (${item.unit})</h2>
                        </div>
                        <span id="badge_${originalIdx}" class="${badgeClass} text-[10px] px-2 py-0.5 rounded-full shrink-0 flex items-center gap-1">
                            ${badgeText}
                        </span>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 sm:gap-2 mb-2.5">
                        <div class="out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5 text-center">จำนวนเต็ม</span>
                            <input type="number" id="f_${originalIdx}" value="${item.today?.full ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'full', this.value)" class="w-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 rounded-xl p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
                        </div>
                        
                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5 text-center">เศษปกติ</span>
                            <div class="flex items-center">
                                <input type="number" id="f1_${originalIdx}" value="${item.today?.frac1 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac1', this.value)" class="w-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 rounded-xl p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none pr-6" placeholder="0">
                                <button onclick="openCalculator('f1_${originalIdx}', 'เศษปกติ: ${item.name}')" class="absolute right-1 bottom-1.5 text-slate-400 hover:text-emerald-500 p-0.5 text-xs z-10">🧮</button>
                            </div>
                        </div>

                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5 text-center">เศษกระปุก</span>
                            <div class="flex items-center">
                                <input type="number" id="f2_${originalIdx}" value="${item.today?.frac2 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac2', this.value)" class="w-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 rounded-xl p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none pr-6" placeholder="0">
                                <button onclick="openCalculator('f2_${originalIdx}', 'เศษกระปุก: ${item.name}')" class="absolute right-1 bottom-1.5 text-slate-400 hover:text-emerald-500 p-0.5 text-xs z-10">🧮</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pt-2 border-t border-slate-100 dark:border-slate-800/80 gap-2">
                        <div class="flex gap-1.5 w-full sm:w-auto">
                            <button onclick="setAsYst(${originalIdx})" class="flex-1 sm:flex-none bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 hover:bg-slate-100 text-slate-700 dark:text-slate-200 px-2 py-1 rounded-lg text-[10px] font-medium transition">
                                ↺ ยอดเมื่อวาน
                            </button>
                            <button onclick="setAsZero(${originalIdx})" class="flex-1 sm:flex-none bg-slate-50 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 hover:bg-rose-50 text-rose-600 dark:text-rose-400 px-2 py-1 rounded-lg text-[10px] font-medium transition">
                                ✕ ของหมด (0)
                            </button>
                        </div>
                        
                        <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-2 text-[10px] sm:text-[11px]">
                            <span class="text-slate-400 font-mono">เมื่อวาน: ${item.yst?.full ?? 0} | ${item.yst?.frac ?? 0}</span>
                            <span id="summary_${originalIdx}" class="text-emerald-800 dark:text-emerald-300 font-bold bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded-md border border-emerald-200/60 dark:border-emerald-800 font-mono">
                                ( เต็ม : ${fFullVal} | เศษ : ${totalFrac} )
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.updateFirebaseInput = function(idx, field, val) {
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today/${field}`] = val;
            update(ref(db), updates);
        };

        window.setAsYst = function(idx) {
            const item = stockItems[idx];
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: item.yst?.full ?? 0,
                frac1: item.yst?.frac ?? 0,
                frac2: 0
            };
            update(ref(db), updates);
        };

        window.setAsZero = function(idx) {
            const item = stockItems[idx];
            const isCurrentlyZero = item.today?.full === "0" && item.today?.frac1 === "0" && item.today?.frac2 === "0";
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: isCurrentlyZero ? "" : "0",
                frac1: isCurrentlyZero ? "" : "0",
                frac2: isCurrentlyZero ? "" : "0"
            };
            update(ref(db), updates);
        };

        window.startNewDay = function() {
            if (confirm("🌅 ต้องการเริ่มรอบวันใหม่ใช่หรือไม่?\n(ค่ายอดนับวันนี้จะถูกย้ายเป็นยอดเมื่อวานบนระบบ Realtime)")) {
                const newItems = stockItems.map(item => {
                    item.yst.full = item.today?.full !== "" && item.today?.full !== null ? item.today.full : item.yst.full;
                    item.today = { full: "", frac1: "", frac2: "" };
                    return item;
                });
                set(ref(db, `stock_${currentMode}`), newItems);
            }
        };

        window.submitToGoogleSheets = async function() {
            const completedItems = stockItems.filter(item => getStatusType(item) === 'done');
            if (completedItems.length === 0) {
                alert("⚠️ ยังไม่มีรายการที่นับเสร็จแล้ว กรุณานับให้อย่างน้อย 1 รายการก่อนส่งข้อมูล");
                return;
            }

            if (!confirm(`📤 ต้องการส่งข้อมูลจำนวน ${completedItems.length} รายการ ไปยัง Google Sheets ใช่หรือไม่?`)) return;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode, items: completedItems })
                });
                alert(`✅ ส่งข้อมูลจำนวน ${completedItems.length} รายการ ไปยัง Google Sheets เรียบร้อยแล้ว!`);
            } catch (error) {
                alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล");
            }
        };

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark'); icon.innerText = "☀️";
            } else {
                html.classList.remove('dark'); html.classList.add('light'); icon.innerText = "🌙";
            }
        };

        window.openCalculator = function(inputId, titleText) {
            activeInputId = inputId;
            document.getElementById("calcTitle").innerText = titleText;
            window.calcValue = document.getElementById(inputId).value || "0";
            document.getElementById("calcDisplay").value = window.calcValue;
            document.getElementById("calcModal").classList.remove("hidden");
        };

        window.closeCalculator = function() {
            document.getElementById("calcModal").classList.add("hidden");
            activeInputId = null;
        };

        window.calcValue = "0";
        window.calcAppend = function(val) {
            window.calcValue = window.calcValue === "0" && !isNaN(val) ? val : window.calcValue + val;
            document.getElementById("calcDisplay").value = window.calcValue;
        };
        window.calcClear = function() { window.calcValue = "0"; document.getElementById("calcDisplay").value = "0"; };
        window.calcBack = function() { window.calcValue = window.calcValue.slice(0, -1) || "0"; document.getElementById("calcDisplay").value = window.calcValue; };
        window.calcApply = function() {
            try { 
                const result = eval(window.calcValue).toString();
                if (activeInputId) {
                    const inputEl = document.getElementById(activeInputId);
                    inputEl.value = result;
                    
                    const parts = activeInputId.split('_');
                    const fieldType = parts[0] === 'f1' ? 'frac1' : 'frac2';
                    const idx = parseInt(parts[1]);
                    window.updateFirebaseInput(idx, fieldType, result);
                }
                closeCalculator();
            } catch(e) { document.getElementById("calcDisplay").value = "Error"; window.calcValue = "0"; }
        };

        listenToFirebase();
    </script>
</body>
</html>
