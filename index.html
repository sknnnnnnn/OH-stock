<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OH-stock System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-28 transition-colors duration-300">

  <header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700 sticky top-0 z-20 shadow-xs transition-colors duration-300">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-green-600 text-xl"></i>
        <h1 class="font-bold text-lg">OH-stock</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
        <button id="refreshBtn" class="p-2 rounded-lg bg-green-50 dark:bg-slate-700 text-green-600 dark:text-green-400 hover:bg-green-100 dark:hover:bg-slate-600 transition" title="ดึงข้อมูลล่าสุด">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-3">
    <!-- Navigation Modes -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-200 dark:bg-slate-800 rounded-xl">
      <button id="modeDaily" class="py-2 text-sm font-semibold rounded-lg transition bg-white dark:bg-slate-700 text-green-600 dark:text-green-400 shadow-xs">
        <i class="fa-regular fa-calendar-day mr-1"></i> รายวัน (Daily)
      </button>
      <button id="modeWeekly" class="py-2 text-sm font-semibold rounded-lg transition text-slate-500 dark:text-slate-400 hover:text-slate-700">
        <i class="fa-regular fa-calendar-week mr-1"></i> รายสัปดาห์ (Weekly)
      </button>
    </div>

    <!-- Status Bar -->
    <div id="statusCard" class="bg-emerald-50 dark:bg-slate-800/80 border border-emerald-200 dark:border-slate-700 rounded-xl p-3 text-xs flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="statusText" class="font-medium text-emerald-800 dark:text-emerald-300">เชื่อมต่อ Realtime พร้อมทำงาน</span>
      </div>
      <span id="lastUpdated" class="text-slate-400">อัปเดตล่าสุด: -</span>
    </div>

    <!-- Search & Filters -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input type="text" id="searchInput" placeholder="ค้นหารายการสินค้า..." class="w-full pl-9 pr-4 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 transition">
    </div>

    <!-- Inventory List Container -->
    <div id="itemList" class="space-y-2">
      <!-- Loading Placeholder -->
      <div class="p-8 text-center text-slate-400 space-y-2">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-green-500"></i>
        <p class="text-xs">กำลังโหลดข้อมูลสินค้า...</p>
      </div>
    </div>
  </main>

  <!-- Sticky Bottom Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 p-3 z-30">
    <div class="max-w-3xl mx-auto flex gap-2">
      <button id="syncSheetBtn" class="flex-1 py-2.5 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2">
        <i class="fa-file-excel text-green-600"></i> ดึงข้อมูลจาก Sheets
      </button>
      <button id="saveSheetBtn" class="flex-1 py-2.5 px-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-medium text-sm transition shadow-md shadow-green-600/20 flex items-center justify-center gap-2">
        <i class="fa-paper-plane"></i> ส่งเข้า Sheets
      </button>
    </div>
  </div>

  <!-- Firebase SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config (แก้ไข URL Region Asia เรียบร้อยแล้ว)
    const firebaseConfig = {
      databaseURL: "https://oj-stock-a6af4-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentMode = 'daily'; // 'daily' or 'weekly'
    let stockData = {};

    // DOM Elements
    const itemList = document.getElementById('itemList');
    const searchInput = document.getElementById('searchInput');
    const modeDaily = document.getElementById('modeDaily');
    const modeWeekly = document.getElementById('modeWeekly');
    const lastUpdated = document.getElementById('lastUpdated');

    // Realtime Listener
    function listenToDatabase() {
      const dbRef = ref(db, `stock_${currentMode}`);
      onValue(dbRef, (snapshot) => {
        stockData = snapshot.val() || {};
        renderList();
        lastUpdated.textContent = `อัปเดต: ${new Date().toLocaleTimeString('th-TH')}`;
      });
    }

    // Render Items
    function renderList() {
      const query = searchInput.value.toLowerCase().trim();
      itemList.innerHTML = '';

      const keys = Object.keys(stockData);
      if (keys.length === 0) {
        itemList.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">ไม่พบรายการสินค้าในระบบ</div>`;
        return;
      }

      keys.filter(key => key.toLowerCase().includes(query)).forEach(key => {
        const item = stockData[key];
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 flex items-center justify-between shadow-2xs hover:border-slate-300 transition";

        card.innerHTML = `
          <div class="flex-1 pr-2">
            <h3 class="font-semibold text-sm line-clamp-1">${key}</h3>
            <p class="text-xs text-slate-400">หมวดหมู่: ${item.category || '-'}</p>
          </div>
          <div class="flex items-center gap-1.5">
            <button class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 flex items-center justify-center text-sm font-bold transition active:scale-95 btn-minus" data-key="${key}">-</button>
            <input type="number" class="w-12 h-8 text-center bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-bold focus:outline-none focus:ring-1 focus:ring-green-500 item-qty" data-key="${key}" value="${item.qty || 0}">
            <button class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 flex items-center justify-center text-sm font-bold transition active:scale-95 btn-plus" data-key="${key}">+</button>
          </div>
        `;
        itemList.appendChild(card);
      });

      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('.btn-minus').forEach(btn => {
        btn.onclick = (e) => {
          const key = e.target.dataset.key;
          const current = Number(stockData[key]?.qty || 0);
          updateQty(key, Math.max(0, current - 1));
        };
      });

      document.querySelectorAll('.btn-plus').forEach(btn => {
        btn.onclick = (e) => {
          const key = e.target.dataset.key;
          const current = Number(stockData[key]?.qty || 0);
          updateQty(key, current + 1);
        };
      });

      document.querySelectorAll('.item-qty').forEach(input => {
        input.onchange = (e) => {
          const key = e.target.dataset.key;
          const val = Math.max(0, Number(e.target.value) || 0);
          updateQty(key, val);
        };
      });
    }

    function updateQty(key, newQty) {
      if (!stockData[key]) return;
      set(ref(db, `stock_${currentMode}/${key}/qty`), newQty);
    }

    // Switch Mode
    modeDaily.onclick = () => {
      currentMode = 'daily';
      modeDaily.className = "py-2 text-sm font-semibold rounded-lg transition bg-white dark:bg-slate-700 text-green-600 dark:text-green-400 shadow-xs";
      modeWeekly.className = "py-2 text-sm font-semibold rounded-lg transition text-slate-500 dark:text-slate-400 hover:text-slate-700";
      listenToDatabase();
    };

    modeWeekly.onclick = () => {
      currentMode = 'weekly';
      modeWeekly.className = "py-2 text-sm font-semibold rounded-lg transition bg-white dark:bg-slate-700 text-green-600 dark:text-green-400 shadow-xs";
      modeDaily.className = "py-2 text-sm font-semibold rounded-lg transition text-slate-500 dark:text-slate-400 hover:text-slate-700";
      listenToDatabase();
    };

    // Dark Mode Toggle
    document.getElementById('themeToggle').onclick = () => {
      document.documentElement.classList.toggle('dark');
    };

    searchInput.oninput = renderList;

    // Start Realtime
    listenToDatabase();
  </script>
</body>
</html>
