<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OH stock - Realtime Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .out-of-stock-wrapper { position: relative; }
        .out-of-stock-wrapper.sold-out::after {
            content: "ของหมด";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: rgba(239, 68, 68, 0.6);
            background-color: rgba(254, 242, 242, 0.7);
            border-radius: 0.5rem;
            pointer-events: none;
            letter-spacing: 0.05em;
            transform: rotate(-5deg);
        }
        .dark .out-of-stock-wrapper.sold-out::after {
            background-color: rgba(15, 23, 42, 0.8);
            color: rgba(248, 113, 113, 0.7);
        }
        @keyframes popGreen {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .pop-animation { animation: popGreen 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-28 transition-colors duration-300">

    <header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700 sticky top-0 z-20 shadow-xs transition-colors duration-300">
        <div class="max-w-3xl mx-auto px-4 py-3 space-y-3">
            
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🧋</span>
                    <h1 class="font-semibold text-sm sm:text-base text-slate-900 dark:text-white">OH stock</h1>
                    <span id="syncStatus" class="text-[10px] text-amber-600 bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded-full border border-amber-200">⏳ กำลังเชื่อมต่อ...</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <div class="flex bg-slate-100 dark:bg-slate-700 p-1 rounded-lg">
                        <button id="btnDaily" onclick="switchMode('daily')" class="px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition">Daily</button>
                        <button id="btnWeekly" onclick="switchMode('weekly')" class="px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition">Weekly</button>
                    </div>

                    <button onclick="toggleDarkMode()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 p-1.5 rounded-lg text-xs transition">
                        <span id="themeIcon">🌙</span>
                    </button>
                </div>
            </div>

            <div class="space-y-2 pt-1 border-t border-slate-100 dark:border-slate-700/60">
                <div class="flex justify-between items-center text-xs">
                    <div class="flex items-center gap-3">
                        <span>📊 สถานะการนับ:</span>
                        <span class="font-bold text-emerald-600 dark:text-emerald-400">นับเสร็จ: <span id="countDone">0</span></span>
                        <span class="text-slate-400">|</span>
                        <span class="font-bold text-slate-700 dark:text-slate-200">ทั้งหมด: <span id="countTotal">0</span></span>
                        <span class="text-slate-400">|</span>
                        <span class="font-bold text-amber-600 dark:text-amber-400">รอนับ: <span id="countPending">0</span></span>
                    </div>
                </div>

                <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 ค้นหารหัส หรือ ชื่อสินค้า..." 
                    class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                
                <div class="flex gap-1">
                    <button id="filterAll" onclick="setFilter('all')" class="flex-1 py-1.5 text-xs rounded-lg border bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium">ทั้งหมด</button>
                    <button id="filterPending" onclick="setFilter('pending')" class="flex-1 py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700">⏳ รอนับ / ยังไม่ครบ</button>
                    <button id="filterDone" onclick="setFilter('done')" class="flex-1 py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700">✅ นับเสร็จแล้ว</button>
                </div>

                <div id="categoryContainer" class="flex gap-1.5 overflow-x-auto pb-1 text-xs"></div>
            </div>

        </div>
        
        <div class="bg-slate-200 dark:bg-slate-700 h-1.5 w-full">
            <div id="progressBar" class="bg-emerald-500 h-1.5 transition-all duration-500" style="width: 0%"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 space-y-3">

        <div class="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-xs border border-slate-200 dark:border-slate-700 flex flex-wrap gap-2 justify-between items-center">
            <div class="flex flex-wrap gap-1.5 w-full">
                <button onclick="fetchFromSheetsAndSyncFirebase()" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 transition">
                    🔄 อัปเดตรายการสินค้าจาก Sheets
                </button>
                <button onclick="submitToGoogleSheets()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 shadow-xs transition">
                    📤 ยืนยันส่งข้อมูลเข้าระบบ
                </button>
                <button onclick="startNewDay()" class="flex-1 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1 transition">
                    🌅 เริ่มรอบวันใหม่ (รีเซ็ตการนับ)
                </button>
            </div>
        </div>

        <div id="stockList" class="space-y-3"></div>

    </main>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config ของคุณ oj-stock-a6af4
        const firebaseConfig = {
            apiKey: "AIzaSyDRQW8NeX4P4VjDLFrjZXx8S8XOyA47I58",
            authDomain: "oj-stock-a6af4.firebaseapp.com",
            databaseURL: "https://oj-stock-a6af4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oj-stock-a6af4",
            storageBucket: "oj-stock-a6af4.firebasestorage.app",
            messagingSenderId: "916746183266",
            appId: "1:916746183266:web:85325fdf4e87313db6673b",
            measurementId: "G-LTGJR4QFW5"
        };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHaL8Ec89aJuRAnxtkFDZMKLOjBE3zeKCqXOOOOxo-VIAR3OWNDt2RLs4o4G4tAb8/exec";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentMode = 'daily';
        let currentFilter = 'all';
        let selectedCategory = 'ทั้งหมด';
        let lastCompletedCount = 0;
        let stockItems = [];

        const statusEl = document.getElementById("syncStatus");

        // คอยดึงข้อมูลจาก Firebase แบบ Realtime (มีคนแก้ไขปุ๊บ ข้อมูลอัปเดตทุกเครื่องทันที)
        function listenToFirebase() {
            const stockRef = ref(db, `stock_${currentMode}`);
            onValue(stockRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    stockItems = Array.isArray(data) ? data : Object.values(data);
                    statusEl.innerText = "🟢 Realtime Sync พร้อมทำงาน";
                    statusEl.className = "text-[10px] text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-2 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800";
                } else {
                    // ถ้าใน Firebase ยังไม่มีข้อมูล ให้โหลดจาก Google Sheets มาใส่ครั้งแรก
                    fetchFromSheetsAndSyncFirebase(true);
                }
                renderCategories();
                renderList();
            }, (error) => {
                console.error("Firebase Read Error:", error);
                statusEl.innerText = "❌ เชื่อมต่อ Firebase ไม่สำเร็จ (เช็ค Rules)";
                statusEl.className = "text-[10px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200";
            });
        }

        // ดึงรายการจาก Google Sheets มาอัปเดตใส่ Firebase
        window.fetchFromSheetsAndSyncFirebase = async function(isInitial = false) {
            if (!isInitial && !confirm("🔄 ต้องการดึงโครงสร้างรายการสินค้าใหม่จาก Google Sheets ใช่หรือไม่?")) return;

            statusEl.innerText = "🔄 กำลังดึงจาก Sheets...";
            try {
                const response = await fetch(`${WEB_APP_URL}?mode=${currentMode}`);
                const rawData = await response.json();

                if (Array.isArray(rawData) && rawData.length > 0) {
                    const formattedData = rawData.map(item => {
                        item.count_type = item.count_type ? item.count_type.toString().trim().toLowerCase() : 'both';
                        if (!item.today) item.today = { full: "", frac1: "", frac2: "" };
                        return item;
                    });
                    
                    // บันทึกลง Firebase
                    await set(ref(db, `stock_${currentMode}`), formattedData);
                    alert("✅ อัปเดตรายการสินค้าเข้าสู่ระบบเรียบร้อย!");
                }
            } catch (err) {
                console.error(err);
                alert("❌ เกิดข้อผิดพลาดในการดึงข้อมูลจาก Sheets");
            }
        };

        window.switchMode = function(mode) {
            currentMode = mode;
            selectedCategory = 'ทั้งหมด';
            document.getElementById('btnDaily').className = mode === 'daily' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            document.getElementById('btnWeekly').className = mode === 'weekly' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            listenToFirebase();
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'pending', 'done'].forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1)}`);
                if (f === filter) {
                    btn.className = "flex-1 py-1.5 text-xs rounded-lg border bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs rounded-lg border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700";
                }
            });
            renderList();
        };

        function getStatusType(item) {
            if (!item || !item.today) return 'empty';
            const f = item.today.full;
            const f1 = item.today.frac1;
            const f2 = item.today.frac2;
            let type = item.count_type || 'both';

            const hasFull = f !== "" && f !== null && f !== undefined;
            const hasFrac1 = f1 !== "" && f1 !== null && f1 !== undefined;
            const hasFrac2 = f2 !== "" && f2 !== null && f2 !== undefined;
            const hasAnyInput = hasFull || hasFrac1 || hasFrac2;

            if (!hasAnyInput) return 'empty'; 

            if (type === 'full') return hasFull ? 'done' : 'incomplete';
            if (type === 'frac') return hasFrac1 ? 'done' : 'incomplete';
            if (type === 'frac2') return (hasFrac1 && hasFrac2) ? 'done' : 'incomplete';
            
            if (type === 'both') {
                if (hasFull && (hasFrac1 || hasFrac2)) return 'done';
                return 'incomplete';
            }
            return 'incomplete';
        }

        function updateProgressAndUI() {
            if (stockItems.length === 0) return;
            const total = stockItems.length;
            const completed = stockItems.filter(i => getStatusType(i) === 'done').length;
            const pending = total - completed;
            const percent = Math.round((completed / total) * 100);

            document.getElementById("progressBar").style.width = `${percent}%`;
            document.getElementById("countDone").innerText = completed;
            document.getElementById("countTotal").innerText = total;
            document.getElementById("countPending").innerText = pending;

            if (percent === 100 && lastCompletedCount < total) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
            lastCompletedCount = completed;
        }

        function renderCategories() {
            const container = document.getElementById("categoryContainer");
            if (!container) return;
            container.innerHTML = "";
            const categories = ["ทั้งหมด", ...new Set(stockItems.map(i => i.category))];

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-3 py-1.5 rounded-lg border text-xs whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-800 dark:border-slate-200 font-medium' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`;
                btn.innerText = cat;
                btn.onclick = () => { selectedCategory = cat; renderCategories(); renderList(); };
                container.appendChild(btn);
            });
        }

        window.renderList = function() {
            const container = document.getElementById("stockList");
            if (!container) return;
            container.innerHTML = "";
            const searchVal = document.getElementById("searchInput")?.value.toLowerCase() || "";

            let items = stockItems.filter(item => {
                const matchCategory = selectedCategory === 'ทั้งหมด' || item.category === selectedCategory;
                const matchSearch = item.id.toLowerCase().includes(searchVal) || item.name.toLowerCase().includes(searchVal);
                if (!matchCategory || !matchSearch) return false;
                
                const status = getStatusType(item);
                if (currentFilter === 'pending') return status === 'empty' || status === 'incomplete';
                if (currentFilter === 'done') return status === 'done';
                return true;
            });

            updateProgressAndUI();

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">ไม่พบรายการสินค้า</div>`;
                return;
            }

            items.forEach((item) => {
                const originalIdx = stockItems.indexOf(item);
                let cleanType = item.count_type || 'both';
                
                const fFullVal = item.today?.full !== "" && item.today?.full !== null ? item.today?.full : 0;
                const f1Val = parseFloat(item.today?.frac1) || 0;
                
                let f2Val = parseFloat(item.today?.frac2) || 0;
                let finalFrac2 = f2Val - (item.tare || 0);
                if (finalFrac2 < 0) finalFrac2 = 0;

                const totalFrac = f1Val + finalFrac2;
                const status = getStatusType(item);

                const isZeroAll = (item.today?.full === 0 || item.today?.full === "0") && 
                                  (item.today?.frac1 === 0 || item.today?.frac1 === "0") && 
                                  (item.today?.frac2 === 0 || item.today?.frac2 === "0");

                let cardBg = 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                let badgeClass = 'text-slate-400 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600';
                let badgeText = '⏳ รอนับ';

                if (status === 'incomplete') {
                    cardBg = 'bg-amber-50/40 dark:bg-amber-950/20 border-amber-200 dark:border-amber-800/50';
                    badgeClass = 'text-amber-700 dark:text-amber-400 bg-amber-100 dark:bg-amber-900/40 border border-amber-200 dark:border-amber-700';
                    badgeText = '⏳ ยังไม่ครบ';
                } else if (status === 'done') {
                    cardBg = 'bg-emerald-50/70 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-700';
                    badgeClass = 'text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/60 border border-emerald-200 dark:border-emerald-700 font-semibold';
                    badgeText = '✅ นับเสร็จแล้ว';
                }

                let typeLabel = cleanType === 'frac' ? "นับเศษ" : cleanType === 'frac2' ? "นับเศษ (2 ช่อง)" : "นับเต็มและเศษ";

                const card = document.createElement("div");
                card.id = `card_${originalIdx}`;
                card.className = `p-4 rounded-xl border transition duration-200 shadow-xs ${cardBg}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-mono text-[11px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">${item.id}</span>
                                <span class="text-[10px] text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/40 px-1.5 py-0.5 rounded border border-indigo-200">📌 ${typeLabel}</span>
                                ${item.tare > 0 ? `<span class="text-[10px] text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 px-1.5 py-0.5 rounded border border-rose-200">✂️ ตัดกระปุก: -${item.tare}</span>` : ''}
                                <span class="text-[10px] text-slate-400 bg-slate-50 dark:bg-slate-700/50 px-1.5 py-0.5 rounded">${item.category}</span>
                            </div>
                            <h2 class="text-xs sm:text-sm font-medium text-slate-900 dark:text-white mt-1">${item.name} (${item.unit})</h2>
                        </div>
                        <span id="badge_${originalIdx}" class="${badgeClass} text-[10px] px-2.5 py-1 rounded-full shrink-0 flex items-center gap-1">
                            ${badgeText}
                        </span>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-2">
                        <div class="out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5">จำนวนเต็ม</span>
                            <input type="number" value="${item.today?.full ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'full', this.value)" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-lg p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
                        </div>
                        
                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5">เศษปกติ</span>
                            <input type="number" value="${item.today?.frac1 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac1', this.value)" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-lg p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
                        </div>

                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5">เศษกระปุก</span>
                            <input type="number" value="${item.today?.frac2 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac2', this.value)" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-lg p-2 text-center text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pt-2.5 border-t border-slate-200/60 dark:border-slate-700 gap-2">
                        <div class="flex gap-1.5">
                            <button onclick="setAsYst(${originalIdx})" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-md text-[11px] font-medium transition">
                                ↺ ใช้ค่ายอดเมื่อวาน
                            </button>
                            <button onclick="setAsZero(${originalIdx})" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-rose-50 text-rose-600 dark:text-rose-400 px-2.5 py-1 rounded-md text-[11px] font-medium transition">
                                ✕ กำหนดของหมด (0)
                            </button>
                        </div>
                        
                        <div class="flex items-center gap-3 text-[11px] flex-wrap">
                            <span class="text-slate-400 font-mono">เมื่อวาน: เต็ม ${item.yst?.full ?? 0} | เศษ ${item.yst?.frac ?? 0}</span>
                            <span class="text-emerald-800 dark:text-emerald-200 font-bold bg-emerald-100/70 dark:bg-emerald-900/40 px-2.5 py-1 rounded-md border border-emerald-200 font-mono">
                                ( เต็ม : ${fFullVal} | เศษรวม : ${totalFrac} )
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // ยิงอัปเดตไปที่ Firebase ทันทีที่พิมพ์เสร็จ
        window.updateFirebaseInput = function(idx, field, val) {
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today/${field}`] = val;
            update(ref(db), updates);
        };

        window.setAsYst = function(idx) {
            const item = stockItems[idx];
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: item.yst.full,
                frac1: item.yst.frac,
                frac2: 0
            };
            update(ref(db), updates);
        };

        window.setAsZero = function(idx) {
            const item = stockItems[idx];
            const isCurrentlyZero = item.today?.full === "0" && item.today?.frac1 === "0" && item.today?.frac2 === "0";
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: isCurrentlyZero ? "" : "0",
                frac1: isCurrentlyZero ? "" : "0",
                frac2: isCurrentlyZero ? "" : "0"
            };
            update(ref(db), updates);
        };

        window.startNewDay = function() {
            if (confirm("🌅 ต้องการเริ่มรอบวันใหม่ใช่หรือไม่?\n(ค่ายอดนับวันนี้จะถูกย้ายเป็นยอดเมื่อวานบน Firebase)")) {
                const newItems = stockItems.map(item => {
                    item.yst.full = item.today?.full !== "" && item.today?.full !== null ? item.today.full : item.yst.full;
                    item.today = { full: "", frac1: "", frac2: "" };
                    return item;
                });
                set(ref(db, `stock_${currentMode}`), newItems);
            }
        };

        window.submitToGoogleSheets = async function() {
            const completedItems = stockItems.filter(item => getStatusType(item) === 'done');
            if (completedItems.length === 0) {
                alert("⚠️ ยังไม่มีรายการที่นับเสร็จแล้ว");
                return;
            }

            if (!confirm(`📤 ต้องการส่งข้อมูล ${completedItems.length} รายการ ไปยัง Google Sheets ใช่หรือไม่?`)) return;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode, items: completedItems })
                });
                alert(`✅ ส่งข้อมูลเรียบร้อยแล้ว!`);
            } catch (error) {
                alert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล");
            }
        };

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark'); icon.innerText = "☀️";
            } else {
                html.classList.remove('dark'); html.classList.add('light'); icon.innerText = "🌙";
            }
        };

        // เริ่มฟัง Firebase
        listenToFirebase();
    </script>
</body>
</html>
