<html lang="th" class="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        
        .input-group-wrapper { position: relative; }
        .input-group-wrapper.sold-out::after {
            content: "สินค้าหมด";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: rgba(225, 29, 72, 0.9);
            background-color: rgba(254, 242, 242, 0.92);
            border-radius: 0.5rem;
            pointer-events: none;
            letter-spacing: 0.05em;
            transform: rotate(-1.5deg);
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .dark .input-group-wrapper.sold-out::after {
            background-color: rgba(15, 23, 42, 0.95);
            color: rgba(251, 113, 133, 0.9);
        }
        
        #mainHeader { transition: transform 0.3s ease-in-out; }
        .header-hidden { transform: translateY(-100%); }

        @keyframes modalPop {
            0% { transform: scale(0.9) translateY(8px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop { animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes floatCute {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: floatCute 2.5s ease-in-out infinite; }

        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spinSlow 3s linear infinite; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-12 transition-colors duration-300">

                    <button onclick="toggleMenu()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 p-1.5 px-2.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-200 transition border border-slate-200/50 dark:border-slate-600">เมนู</button>
                </div>
            </div>

            <div class="pt-1 border-t border-slate-100 dark:border-slate-700/60">

            <textarea id="backupTextArea" readonly class="w-full h-44 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-[10px] font-mono text-slate-700 dark:text-slate-300 outline-none resize-none"></textarea>
            <div class="flex gap-2 pt-1">

                <button onclick="closeBackupModal()" class="px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-300 text-xs font-medium py-2 rounded-lg transition">ปิด</button>

    <div id="cuteModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">

                <button id="modalBtnCancel" onclick="closeCuteModal()" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-300 text-xs font-medium py-2.5 rounded-lg transition hidden active:scale-95">ยกเลิก</button>

    <div id="calcModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-2xl max-w-xs w-full border border-slate-200 dark:border-slate-700 animate-pop space-y-3" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2">
                <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">เครื่องคิดเลขช่วยนับ</span>

            <div class="bg-slate-100 dark:bg-slate-950 p-2.5 rounded-lg text-right border border-slate-200 dark:border-slate-800">

            <div class="grid grid-cols-4 gap-1.5 text-xs font-medium">
                <button onclick="calcInput('C')" class="col-span-2 bg-rose-50 dark:bg-rose-950/50 text-rose-600 p-2 rounded-lg active:scale-95 transition">C</button>
                <button onclick="calcInput('DEL')" class="bg-amber-50 dark:bg-amber-950/50 text-amber-700 p-2 rounded-lg active:scale-95 transition">⌫</button>
                <button onclick="calcInput('/')" class="bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 p-2 rounded-lg active:scale-95 transition">÷</button>

                <button onclick="calcInput('8')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">8</button>
                <button onclick="calcInput('9')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">9</button>
                <button onclick="calcInput('*')" class="bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 p-2 rounded-lg active:scale-95 transition">×</button>
                <button onclick="calcInput('4')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">4</button>
                <button onclick="calcInput('5')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">5</button>
                <button onclick="calcInput('6')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">6</button>
                <button onclick="calcInput('-')" class="bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 p-2 rounded-lg active:scale-95 transition">-</button>
                <button onclick="calcInput('1')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">1</button>
                <button onclick="calcInput('2')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">2</button>
                <button onclick="calcInput('3')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">3</button>
                <button onclick="calcInput('+')" class="bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 p-2 rounded-lg active:scale-95 transition">+</button>
                <button onclick="calcInput('0')" class="col-span-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">0</button>
                <button onclick="calcInput('.')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-100 p-2 rounded-lg active:scale-95 transition">.</button>
                <button onclick="calcInput('=')" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg active:scale-95 transition">=</button>
            </div>
            <button onclick="applyCalculatorResult()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2.5 rounded-lg shadow-xs transition">ใช้ผลลัพธ์นี้</button>
        </div>
    </div>

    <main class="max-w-3xl mx-auto p-3 space-y-2.5">
        <div id="stockList" class="space-y-2.5"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRQW8NeX4P4VjDLFrjZXx8S8XOyA47I58",
            authDomain: "oj-stock-a6af4.firebaseapp.com",
            databaseURL: "https://oj-stock-a6af4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oj-stock-a6af4",
            storageBucket: "oj-stock-a6af4.firebasestorage.app",
            messagingSenderId: "916746183266",
            appId: "1:916746183266:web:85325fdf4e87313db6673b",
            measurementId: "G-LTGJR4QFW5"
        };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-jajYFldXlasI1vTYenZzKI28_Jzh5YIGXd-OFGOxrZ41IOkdBkJSzT2fagnX-Xay/exec";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentMode = 'daily';
        let currentFilter = 'all';
        let selectedCategory = 'ทั้งหมด';
        let lastCompletedCount = 0;
        let stockItems = [];
        let isSyncingFromFirebase = false;

        let activeCalcTarget = { idx: null, field: null };
        let calcVal = "0";
        let calcExpr = "";

        function initTheme() {
            const savedTheme = localStorage.getItem('oh_stock_theme') || 'light';
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'dark') {
                html.classList.remove('light'); html.classList.add('dark');
                if (icon) icon.innerText = "☀️";
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                if (icon) icon.innerText = "🌙";
            }
        }

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark');
                icon.innerText = "☀️";
                localStorage.setItem('oh_stock_theme', 'dark');
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                icon.innerText = "🌙";
                localStorage.setItem('oh_stock_theme', 'light');
            }
        };

        let lastScrollY = window.scrollY;
        const mainHeader = document.getElementById('mainHeader');
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > 60 && currentScrollY > lastScrollY) {
                mainHeader.classList.add('header-hidden');
            } else {
                mainHeader.classList.remove('header-hidden');
            }
            lastScrollY = currentScrollY;
        });

        window.showCuteModal = function({ icon = '✨', title = 'แจ้งเตือน', message = '', showCancel = false, onConfirm = null }) {
            const modal = document.getElementById('cuteModal');
            const iconEl = document.getElementById('modalIcon');
            const iconContainer = document.getElementById('modalIconContainer');
            iconEl.innerText = icon;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            iconContainer.className = "w-14 h-14 mx-auto rounded-xl flex items-center justify-center text-2xl shadow-inner border";
            if (icon === '🎉' || icon === '✨') {
                iconContainer.className += " bg-emerald-50 dark:bg-emerald-950/60 border-emerald-100 text-emerald-600 animate-float";
            } else if (icon === '❌') {
                iconContainer.className += " bg-rose-50 dark:bg-rose-950/60 border-rose-100 text-rose-600 animate-float";
            } else {
                iconContainer.className += " bg-slate-50 dark:bg-slate-900 border-slate-100 text-slate-600";
            }

            const actionsContainer = document.getElementById('modalActions');
            const btnCancel = document.getElementById('modalBtnCancel');
            const btnOk = document.getElementById('modalBtnOk');
            actionsContainer.classList.remove('hidden');

            if (showCancel) {
                btnCancel.classList.remove('hidden');
                btnOk.innerText = "ยืนยัน";
            } else {
                btnCancel.classList.add('hidden');
                btnOk.innerText = "ตกลง";
            }

            btnOk.onclick = () => { closeCuteModal(); if (onConfirm) onConfirm(); };
            modal.classList.remove('hidden');
        };

        window.showLoadingModal = function({ title = 'กำลังโหลด', message = 'กรุณารอสักครู่...' }) {
            const modal = document.getElementById('cuteModal');
            const iconEl = document.getElementById('modalIcon');
            const iconContainer = document.getElementById('modalIconContainer');
            iconEl.innerText = '⏳';
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            iconContainer.className = "w-14 h-14 mx-auto rounded-xl flex items-center justify-center text-2xl shadow-inner border bg-amber-50 dark:bg-amber-950/60 border-amber-100 text-amber-600 animate-spin-slow";
            document.getElementById('modalActions').classList.add('hidden');
            modal.classList.remove('hidden');
        };

        window.closeCuteModal = function() { document.getElementById('cuteModal').classList.add('hidden'); };

        window.openBackupModal = function() {
            let textOutput = "";
            stockItems.forEach((item) => {
                const fFull = item.today?.full !== "" && item.today?.full !== null ? item.today.full : 0;
                const f1 = parseFloat(item.today?.frac1) || 0;
                let f2 = parseFloat(item.today?.frac2) || 0;
                let finalF2 = f2 - (item.tare || 0);
                if (finalF2 < 0) finalF2 = 0;

                const timestamp = new Date().toLocaleString('th-TH');
                textOutput += `${timestamp}\t${item.id || ""}\t${item.name || ""}\t${item.category || "ทั่วไป"}\t${fFull}\t${f1}\t${finalF2}\n`;
            });

            document.getElementById('backupTextArea').value = textOutput.trim();
            document.getElementById('backupModal').classList.remove('hidden');
        };

        window.closeBackupModal = function() { document.getElementById('backupModal').classList.add('hidden'); };

        window.copyBackupText = function() {
            const textarea = document.getElementById('backupTextArea');
            textarea.select();
            try {
                navigator.clipboard.writeText(textarea.value);
                showCuteModal({ icon: '🎉', title: 'คัดลอกสำเร็จ', message: 'คัดลอกข้อมูลเรียบร้อยแล้ว นำไปวางใน Google Sheets ได้เลยครับ' });
            } catch (err) {
                document.execCommand('copy');
                showCuteModal({ icon: '🎉', title: 'คัดลอกสำเร็จ', message: 'คัดลอกข้อมูลเรียบร้อยแล้วครับ' });
            }
        };

        window.openCalculator = function(idx, field) {
            activeCalcTarget = { idx, field };
            const currentVal = stockItems[idx]?.today?.[field] || "0";
            calcVal = currentVal.toString();
            calcExpr = "";
            updateCalcDisplay();
            document.getElementById('calcModal').classList.remove('hidden');
        };

        window.closeCalculator = function() { document.getElementById('calcModal').classList.add('hidden'); };

        function updateCalcDisplay() {
            document.getElementById('calcDisplay').innerText = calcVal || "0";
            document.getElementById('calcExpression').innerText = calcExpr || "0";
        }

        window.calcInput = function(key) {
            if (key === 'C') { calcVal = "0"; calcExpr = ""; }
            else if (key === 'DEL') { calcVal = calcVal.length > 1 ? calcVal.slice(0, -1) : "0"; }
            else if (['+', '-', '*', '/'].includes(key)) { calcExpr = calcVal + " " + key + " "; calcVal = "0"; }
            else if (key === '=') {
                if (calcExpr) {
                    try {
                        const result = Function(`'use strict'; return (${calcExpr + calcVal})`)();
                        calcVal = (Math.round(result * 100) / 100).toString();
                        calcExpr = "";
                    } catch (e) { calcVal = "Error"; }
                }
            } else {
                calcVal = (calcVal === "0" || calcVal === "Error") ? key : calcVal + key;
            }
            updateCalcDisplay();
        };

        window.applyCalculatorResult = function() {
            if (activeCalcTarget.idx !== null && activeCalcTarget.field !== null && calcVal !== "Error") {
                updateFirebaseInput(activeCalcTarget.idx, activeCalcTarget.field, calcVal);
            }
            closeCalculator();
        };

        function listenToFirebase() {
            const stockRef = ref(db, `stock_${currentMode}`);
            onValue(stockRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    stockItems = Array.isArray(data) ? data : Object.values(data);
                } else {
                    fetchFromSheetsAndSyncFirebase(true);
                }
                isSyncingFromFirebase = true;
                renderCategories();
                renderList();
                setTimeout(() => { isSyncingFromFirebase = false; }, 300);
            });
        }

        window.fetchFromSheetsAndSyncFirebase = function(isInitial = false) {
            const doFetch = async () => {
                showLoadingModal({ title: 'กำลังซิงค์ข้อมูล', message: 'กำลังดึงรายการสินค้าจาก Google Sheets...' });
                try {
                    const response = await fetch(`${WEB_APP_URL}?mode=${currentMode}`);
                    const rawData = await response.json();
                    if (Array.isArray(rawData) && rawData.length > 0) {
                        const oldItemsMap = new Map();
                        if (stockItems && stockItems.length > 0) {
                            stockItems.forEach(item => { if (item.id) oldItemsMap.set(item.id.toString().trim(), item); });
                        }
                        const formattedData = rawData.map(item => {
                            const itemId = item.id ? item.id.toString().trim() : "";
                            const existingItem = oldItemsMap.get(itemId);
                            return {
                                id: itemId,
                                name: item.name || "",
                                category: item.category || "ทั่วไป",
                                unit: item.unit || "หน่วย",
                                count_type: item.count_type ? item.count_type.toString().trim().toLowerCase() : 'both',
                                tare: parseFloat(item.tare) || 0,
                                yst: existingItem ? existingItem.yst : { full: parseFloat(item.yst?.full) || 0, frac: parseFloat(item.yst?.frac) || 0 },
                                today: existingItem ? existingItem.today : { full: "", frac1: "", frac2: "" }
                            };
                        });
                        await set(ref(db, `stock_${currentMode}`), formattedData);
                        showCuteModal({ icon: '🎉', title: 'สำเร็จ', message: 'อัปเดตรายการสินค้าเรียบร้อยแล้วครับ' });
                    }
                } catch (err) {
                    showCuteModal({ icon: '❌', title: 'เกิดข้อผิดพลาด', message: 'ไม่สามารถดึงข้อมูลจาก Google Sheets ได้' });
                }
            };
            if (!isInitial) {
                showCuteModal({ icon: '🔄', title: 'ยืนยันการดึงข้อมูล', message: 'ต้องการดึงโครงสร้างรายการสินค้าใหม่จาก Google Sheets ใช่ไหมครับ?', showCancel: true, onConfirm: doFetch });
            } else { doFetch(); }
        };

        window.switchMode = function(mode) {
            currentMode = mode;
            selectedCategory = 'ทั้งหมด';
            document.getElementById('btnDaily').className = mode === 'daily' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            document.getElementById('btnWeekly').className = mode === 'weekly' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            listenToFirebase();
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'pending', 'done'].forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1)}`);
                if (f === filter) {
                    btn.className = "flex-1 py-1 text-[11px] rounded-lg border bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium transition";
                } else {
                    btn.className = "flex-1 py-1 text-[11px] rounded-lg border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 transition";
                }
            });
            renderList();
        };

        function getStatusType(item) {
            if (!item || !item.today) return 'empty';
            const f = item.today.full, f1 = item.today.frac1, f2 = item.today.frac2, type = item.count_type || 'both';
            const hasFull = f !== "" && f !== null && f !== undefined;
            const hasFrac1 = f1 !== "" && f1 !== null && f1 !== undefined;
            const hasFrac2 = f2 !== "" && f2 !== null && f2 !== undefined;
            if (!hasFull && !hasFrac1 && !hasFrac2) return 'empty';
            if (type === 'full') return hasFull ? 'done' : 'incomplete';
            if (type === 'frac') return hasFrac1 ? 'done' : 'incomplete';
            if (type === 'frac2') return (hasFrac1 && hasFrac2) ? 'done' : 'incomplete';
            if (type === 'both') return (hasFull && (hasFrac1 || hasFrac2)) ? 'done' : 'incomplete';
            return 'incomplete';
        }

        function updateProgressAndUI() {
            if (stockItems.length === 0) return;
            const total = stockItems.length;
            const completed = stockItems.filter(i => getStatusType(i) === 'done').length;
            const percent = Math.round((completed / total) * 100);
            document.getElementById("progressBar").style.width = `${percent}%`;
            document.getElementById("countDone").innerText = completed;
            document.getElementById("countTotal").innerText = total;
            document.getElementById("countPending").innerText = total - completed;
            if (percent === 100 && lastCompletedCount < total) { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); }
            lastCompletedCount = completed;
        }

        function renderCategories() {
            const container = document.getElementById("categoryContainer");
            if (!container) return;
            container.innerHTML = "";
            ["ทั้งหมด", ...new Set(stockItems.map(i => i.category || "ทั่วไป"))].forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-2.5 py-1 rounded-lg border text-[11px] whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-800 font-medium' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`;
                btn.innerText = cat;
                btn.onclick = () => { selectedCategory = cat; renderCategories(); renderList(); };
                container.appendChild(btn);
            });
        }

        window.renderList = function() {
            if (isSyncingFromFirebase && document.activeElement && document.activeElement.tagName === 'INPUT') return;
            const container = document.getElementById("stockList");
            if (!container) return;
            container.innerHTML = "";
            const searchVal = document.getElementById("searchInput")?.value.toLowerCase() || "";

            let items = stockItems.filter(item => {
                const matchCategory = selectedCategory === 'ทั้งหมด' || (item.category || "ทั่วไป") === selectedCategory;
                const matchSearch = (item.id || "").toLowerCase().includes(searchVal) || (item.name || "").toLowerCase().includes(searchVal);
                if (!matchCategory || !matchSearch) return false;
                const status = getStatusType(item);
                if (currentFilter === 'pending') return status === 'empty' || status === 'incomplete';
                if (currentFilter === 'done') return status === 'done';
                return true;
            });

            updateProgressAndUI();

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">ไม่พบรายการสินค้า</div>`;

            }

            items.forEach((item) => {
                const originalIdx = stockItems.indexOf(item);
                let cleanType = item.count_type || 'both';
                const fFullVal = item.today?.full !== "" && item.today?.full !== null ? item.today?.full : 0;
                const f1Val = parseFloat(item.today?.frac1) || 0;
                let f2Val = parseFloat(item.today?.frac2) || 0;
                let finalFrac2 = Math.max(0, f2Val - (item.tare || 0));
                const totalFrac = Math.round((f1Val + finalFrac2) * 100) / 100;
                const status = getStatusType(item);
                const isNeedTare = cleanType === 'frac2' || (item.tare && item.tare > 0);
                const isZeroAll = (item.today?.full === 0 || item.today?.full === "0") && (item.today?.frac1 === 0 || item.today?.frac1 === "0") && (!isNeedTare || item.today?.frac2 === 0 || item.today?.frac2 === "0");

                    cardBg = 'bg-amber-50/70 dark:bg-amber-950/30 border border-amber-300 dark:border-amber-700';
                    badgeClass = 'text-amber-700 dark:text-amber-300 bg-amber-100 dark:bg-amber-900/50 border border-amber-200 dark:border-amber-800 font-medium';
                    badgeText = '⏳ ยังไม่ครบ';
                } else if (status === 'done') {
                    cardBg = 'bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-300 dark:border-emerald-700';
                    badgeClass = 'text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800 font-medium';
                    badgeText = '✅ นับแล้ว';
                }

                let typeLabel = isNeedTare ? "นับเศษ (หักกระปุก)" : (cleanType === 'frac' ? "นับเศษ" : "เต็มและเศษ");
                const card = document.createElement("div");
                card.id = `card_${originalIdx}`;
                card.className = `p-3 sm:p-3.5 rounded-xl transition duration-200 shadow-xs ${cardBg}`;
                const gridClass = isNeedTare ? "grid-cols-3" : "grid-cols-2";
                const inputStyle = "stock-input w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 text-slate-900 dark:text-emerald-400 font-semibold text-sm sm:text-base rounded-lg p-1.5 text-center focus:ring-1 focus:ring-emerald-500 outline-none shadow-inner transition";

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-mono text-[10px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700/60 px-1.5 py-0.5 rounded font-medium">${item.id}</span>
                                <span class="text-[9px] text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-1.5 py-0.5 rounded border border-indigo-100 dark:border-indigo-900">${typeLabel}</span>
                                ${item.tare > 0 ? `<span class="text-[9px] text-rose-600 bg-rose-50 dark:bg-rose-950/60 px-1.5 py-0.5 rounded border border-rose-100 dark:border-rose-900">กระปุก -${item.tare}</span>` : ''}
                                <span class="text-[9px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700/60 px-1.5 py-0.5 rounded">${item.category || 'ทั่วไป'}</span>
                            </div>
                            <h2 class="text-xs sm:text-sm font-medium text-slate-900 dark:text-white mt-1 leading-snug">${item.name}</h2>
                        </div>
                        <span id="badge_${originalIdx}" class="${badgeClass} text-[10px] px-2 py-0.5 rounded-md shrink-0 flex items-center gap-1">${badgeText}</span>
                    </div>
                    <div class="input-group-wrapper ${isZeroAll ? 'sold-out' : ''}">
                        <div class="grid ${gridClass} gap-2 mb-2">
                            <div>
                                <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">จำนวนเต็ม</span>
                                <input type="number" id="input_${originalIdx}_full" value="${item.today?.full ?? ''}" onblur="updateFirebaseInput(${originalIdx}, 'full', this.value)" onkeydown="handleInputKeydown(event, ${originalIdx}, 'full')" class="${inputStyle}" placeholder="0">
                            </div>
                            <div class="relative">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[10px] text-slate-500 dark:text-slate-400">${isNeedTare ? 'เศษปกติ' : 'เศษ'}</span>
                                    <button onclick="openCalculator(${originalIdx}, 'frac1')" class="text-[11px] hover:scale-110 active:scale-95 transition text-slate-400 hover:text-slate-600">🧮</button>
                                </div>
                                <input type="number" id="input_${originalIdx}_frac1" value="${item.today?.frac1 ?? ''}" onblur="updateFirebaseInput(${originalIdx}, 'frac1', this.value)" onkeydown="handleInputKeydown(event, ${originalIdx}, 'frac1')" class="${inputStyle}" placeholder="0">
                            </div>
                            ${isNeedTare ? `
                            <div class="relative">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[10px] text-slate-500 dark:text-slate-400">เศษกระปุก</span>
                                    <button onclick="openCalculator(${originalIdx}, 'frac2')" class="text-[11px] hover:scale-110 active:scale-95 transition text-slate-400 hover:text-slate-600">🧮</button>
                                </div>
                                <input type="number" id="input_${originalIdx}_frac2" value="${item.today?.frac2 ?? ''}" onblur="updateFirebaseInput(${originalIdx}, 'frac2', this.value)" onkeydown="handleInputKeydown(event, ${originalIdx}, 'frac2')" class="${inputStyle}" placeholder="0">
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center pt-2 border-t border-slate-100 dark:border-slate-700/60 gap-2">
                        <div class="flex gap-1.5 shrink-0">
                            <button onclick="setAsYst(${originalIdx})" class="flex-1 sm:flex-none bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-600 px-2.5 py-1 rounded-md text-[10px] font-medium transition">ใช้ยอดเมื่อวาน</button>
                            <button onclick="setAsZero(${originalIdx})" class="flex-1 sm:flex-none bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 px-2.5 py-1 rounded-md text-[10px] font-medium transition">หมด (0)</button>
                        </div>
                        <div class="flex items-center justify-between sm:justify-end gap-2 text-[10px] flex-wrap">
                            <span class="text-slate-400 font-mono text-[9px]">เมื่อวาน: เต็ม ${item.yst?.full ?? 0} | เศษ ${item.yst?.frac ?? 0}</span>
                            <span id="summary_${originalIdx}" class="text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-100 dark:border-emerald-900 font-mono text-[10px] font-medium">( เต็ม: ${fFullVal} | เศษรวม: ${totalFrac} )</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.handleInputKeydown = function(event, idx, field) {
            if (event.key === 'Enter') {
                event.preventDefault();
                updateFirebaseInput(idx, field, event.target.value);
                const inputs = Array.from(document.querySelectorAll('.stock-input'));
                const currentIndex = inputs.indexOf(event.target);
                if (currentIndex !== -1 && currentIndex + 1 < inputs.length) {
                    inputs[currentIndex + 1].focus();
                    inputs[currentIndex + 1].select();
                } else { event.target.blur(); }
            }
        };

        window.updateFirebaseInput = function(idx, field, val) {
            if (stockItems[idx] && stockItems[idx].today) { stockItems[idx].today[field] = val; }
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today/${field}`] = val;
            update(ref(db), updates);
            updateCardUI(idx);
        };

        function updateCardUI(idx) {
            const item = stockItems[idx];
            if (!item) return;
            let cleanType = item.count_type || 'both';
            const fFullVal = item.today?.full !== "" && item.today?.full !== null ? item.today?.full : 0;
            const f1Val = parseFloat(item.today?.frac1) || 0;
            let f2Val = parseFloat(item.today?.frac2) || 0;
            let finalFrac2 = Math.max(0, f2Val - (item.tare || 0));
            const totalFrac = Math.round((f1Val + finalFrac2) * 100) / 100;
            const status = getStatusType(item);
            const isNeedTare = cleanType === 'frac2' || (item.tare && item.tare > 0);
            const isZeroAll = (item.today?.full === 0 || item.today?.full === "0") && (item.today?.frac1 === 0 || item.today?.frac1 === "0") && (!isNeedTare || item.today?.frac2 === 0 || item.today?.frac2 === "0");

            const card = document.getElementById(`card_${idx}`);
            const badge = document.getElementById(`badge_${idx}`);
            const summary = document.getElementById(`summary_${idx}`);
            const inputGroupWrapper = card ? card.querySelector('.input-group-wrapper') : null;

            if (inputGroupWrapper) {
                if (isZeroAll) inputGroupWrapper.classList.add('sold-out');
                else inputGroupWrapper.classList.remove('sold-out');
            }

            if (card && badge) {
                if (status === 'incomplete') {
                    card.className = `p-3 sm:p-3.5 rounded-xl transition duration-200 shadow-xs bg-amber-50/70 dark:bg-amber-950/30 border border-amber-300 dark:border-amber-700`;
                    badge.className = `text-amber-700 dark:text-amber-300 bg-amber-100 dark:bg-amber-900/50 border border-amber-200 dark:border-amber-800 font-medium text-[10px] px-2 py-0.5 rounded-md shrink-0 flex items-center gap-1`;
                    badge.innerText = '⏳ ยังไม่ครบ';
                } else if (status === 'done') {
                    card.className = `p-3 sm:p-3.5 rounded-xl transition duration-200 shadow-xs bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-300 dark:border-emerald-700`;
                    badge.className = `text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800 font-medium text-[10px] px-2 py-0.5 rounded-md shrink-0 flex items-center gap-1`;
                    badge.innerText = '✅ นับแล้ว';
                } else {
                    card.className = `p-3 sm:p-3.5 rounded-xl transition duration-200 shadow-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700`;
                    badge.className = `text-slate-500 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-[10px] px-2 py-0.5 rounded-md shrink-0 flex items-center gap-1`;
                    badge.innerText = '⏳ รอนับ';
                }
            }

            if (summary) { summary.innerText = `( เต็ม: ${fFullVal} | เศษรวม: ${totalFrac} )`; }
            updateProgressAndUI();
        }

        window.setAsYst = function(idx) {
            const item = stockItems[idx];
            item.today = { full: item.yst.full, frac1: item.yst.frac, frac2: 0 };
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = item.today;
            update(ref(db), updates);
            const fInput = document.getElementById(`input_${idx}_full`);
            const f1Input = document.getElementById(`input_${idx}_frac1`);
            const f2Input = document.getElementById(`input_${idx}_frac2`);
            if (fInput) fInput.value = item.yst.full;
            if (f1Input) f1Input.value = item.yst.frac;
            if (f2Input) f2Input.value = 0;
            updateCardUI(idx);
        };

        window.setAsZero = function(idx) {
            const item = stockItems[idx];
            const isCurrentlyZero = item.today?.full === "0" && item.today?.frac1 === "0" && item.today?.frac2 === "0";
            item.today = { full: isCurrentlyZero ? "" : "0", frac1: isCurrentlyZero ? "" : "0", frac2: isCurrentlyZero ? "" : "0" };
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = item.today;
            update(ref(db), updates);
            const fInput = document.getElementById(`input_${idx}_full`);
            const f1Input = document.getElementById(`input_${idx}_frac1`);
            const f2Input = document.getElementById(`input_${idx}_frac2`);
            if (fInput) fInput.value = item.today.full;
            if (f1Input) f1Input.value = item.today.frac1;
            if (f2Input) f2Input.value = item.today.frac2;
            updateCardUI(idx);
        };

        window.startNewDay = function() {
            showCuteModal({
                icon: '🌅', title: 'เริ่มรอบวันใหม่', message: 'ต้องการล้างข้อมูลเพื่อเริ่มรอบวันใหม่ใช่ไหมครับ?', showCancel: true,
                onConfirm: () => {
                    const newItems = stockItems.map(item => {
                        item.yst.full = item.today?.full !== "" && item.today?.full !== null ? item.today.full : item.yst.full;
                        item.today = { full: "", frac1: "", frac2: "" };
                        return item;
                    });
                    set(ref(db, `stock_${currentMode}`), newItems);
                    showCuteModal({ icon: '✨', title: 'สำเร็จ', message: 'เริ่มรอบวันใหม่เรียบร้อยแล้วครับ' });
                }
            });
        };

        window.submitToGoogleSheets = async function() {
            showCuteModal({
                icon: '📤', title: 'ยืนยันการส่งข้อมูล', message: 'ต้องการส่งผลการนับทั้งหมดเข้า Google Sheets ใช่ไหมครับ?', showCancel: true,
                onConfirm: async () => {
                    showLoadingModal({ title: 'กำลังส่งข้อมูล', message: 'กำลังบันทึกข้อมูลลง Google Sheets...' });
                    try {
                        const processedItems = stockItems.map(item => {
                            const f1 = parseFloat(item.today?.frac1) || 0;
                            let f2 = parseFloat(item.today?.frac2) || 0;
                            let finalF2 = Math.max(0, f2 - (item.tare || 0));
                            
                            return { 
                                ...item, 
                                today: { 
                                    ...item.today, 
                                    frac_normal: f1,       
                                    frac_tare_net: finalF2, 
                                    frac: f1 + finalF2     
                                } 
                            };
                        });

                        await fetch(WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ mode: currentMode, items: processedItems })
                        });
                        showCuteModal({ icon: '🎉', title: 'สำเร็จ', message: 'ส่งข้อมูลเข้าระบบ Google Sheets เรียบร้อยแล้วครับ' });
                    } catch (error) {
                        showCuteModal({ icon: '❌', title: 'เกิดข้อผิดพลาด', message: 'ไม่สามารถส่งข้อมูลได้ กรุณาใช้ฟังก์ชันสำรองข้อมูล' });
                    }
                }
            });
        };

        window.toggleMenu = function() { document.getElementById('menuDrawer').classList.toggle('hidden'); };

        initTheme();
        listenToFirebase();
    </script>
</body>
</html>
