<!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRQW8NeX4P4VjDLFrjZXx8S8XOyA47I58",
            authDomain: "oj-stock-a6af4.firebaseapp.com",
            databaseURL: "https://oj-stock-a6af4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oj-stock-a6af4",
            storageBucket: "oj-stock-a6af4.firebasestorage.app",
            messagingSenderId: "916746183266",
            appId: "1:916746183266:web:85325fdf4e87313db6673b",
            measurementId: "G-LTGJR4QFW5"
        };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHaL8Ec89aJuRAnxtkFDZMKLOjBE3zeKCqXOOOOxo-VIAR3OWNDt2RLs4o4G4tAb8/exec";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentMode = 'daily';
        let currentFilter = 'all';
        let selectedCategory = 'ทั้งหมด';
        let lastCompletedCount = 0;
        let stockItems = [];

        let activeCalcTarget = { idx: null, field: null };
        let calcVal = "0";
        let calcExpr = "";

        function initTheme() {
            const savedTheme = localStorage.getItem('oh_stock_theme') || 'light';
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');

            if (savedTheme === 'dark') {
                html.classList.remove('light');
                html.classList.add('dark');
                if (icon) icon.innerText = "☀️";
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                if (icon) icon.innerText = "🌙";
            }
        }

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark');
                icon.innerText = "☀️";
                localStorage.setItem('oh_stock_theme', 'dark');
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                icon.innerText = "🌙";
                localStorage.setItem('oh_stock_theme', 'light');
            }
        };

        let lastScrollY = window.scrollY;
        const mainHeader = document.getElementById('mainHeader');

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > 60 && currentScrollY > lastScrollY) {
                mainHeader.classList.add('header-hidden');
            } else {
                mainHeader.classList.remove('header-hidden');
            }
            lastScrollY = currentScrollY;
        });

        window.showCuteModal = function({ icon = '✨', title = 'แจ้งเตือน', message = '', showCancel = false, onConfirm = null }) {
            const modal = document.getElementById('cuteModal');
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            const btnCancel = document.getElementById('modalBtnCancel');
            const btnOk = document.getElementById('modalBtnOk');

            if (showCancel) {
                btnCancel.classList.remove('hidden');
            } else {
                btnCancel.classList.add('hidden');
            }

            btnOk.onclick = () => {
                closeCuteModal();
                if (onConfirm) onConfirm();
            };

            modal.classList.remove('hidden');
        };

        window.closeCuteModal = function() {
            document.getElementById('cuteModal').classList.add('hidden');
        };

        window.openCalculator = function(idx, field) {
            activeCalcTarget = { idx, field };
            const currentVal = stockItems[idx]?.today?.[field] || "0";
            calcVal = currentVal.toString();
            calcExpr = "";
            updateCalcDisplay();
            document.getElementById('calcModal').classList.remove('hidden');
        };

        window.closeCalculator = function() {
            document.getElementById('calcModal').classList.add('hidden');
        };

        function updateCalcDisplay() {
            document.getElementById('calcDisplay').innerText = calcVal || "0";
            document.getElementById('calcExpression').innerText = calcExpr || "0";
        }

        window.calcInput = function(key) {
            if (key === 'C') {
                calcVal = "0";
                calcExpr = "";
            } else if (key === 'DEL') {
                if (calcVal.length > 1) {
                    calcVal = calcVal.slice(0, -1);
                } else {
                    calcVal = "0";
                }
            } else if (['+', '-', '*', '/'].includes(key)) {
                calcExpr = calcVal + " " + key + " ";
                calcVal = "0";
            } else if (key === '=') {
                if (calcExpr) {
                    try {
                        const fullExpr = calcExpr + calcVal;
                        const result = Function(`'use strict'; return (${fullExpr})`)();
                        calcVal = (Math.round(result * 100) / 100).toString();
                        calcExpr = "";
                    } catch (e) {
                        calcVal = "Error";
                    }
                }
            } else {
                if (calcVal === "0" || calcVal === "Error") {
                    calcVal = key;
                } else {
                    calcVal += key;
                }
            }
            updateCalcDisplay();
        };

        window.applyCalculatorResult = function() {
            if (activeCalcTarget.idx !== null && activeCalcTarget.field !== null && calcVal !== "Error") {
                updateFirebaseInput(activeCalcTarget.idx, activeCalcTarget.field, calcVal);
            }
            closeCalculator();
        };

        function listenToFirebase() {
            const stockRef = ref(db, `stock_${currentMode}`);
            onValue(stockRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    stockItems = Array.isArray(data) ? data : Object.values(data);
                } else {
                    fetchFromSheetsAndSyncFirebase(true);
                }
                renderCategories();
                renderList();
            }, (error) => {
                console.error("Firebase Read Error:", error);
            });
        }

        window.fetchFromSheetsAndSyncFirebase = function(isInitial = false) {
            const doFetch = async () => {
                showCuteModal({ icon: '⏳', title: 'กำลังโหลดข้อมูล', message: 'กำลังดึงรายการสินค้าล่าสุดจาก Google Sheets...' });
                try {
                    const response = await fetch(`${WEB_APP_URL}?mode=${currentMode}`);
                    const rawData = await response.json();

                    if (Array.isArray(rawData) && rawData.length > 0) {
                        const formattedData = rawData.map(item => {
                            let itemTare = parseFloat(item.tare) || 0;
                            if (itemTare === 0 && item.name && (item.name.includes('กระปุก') || item.name.includes('กป'))) {
                                itemTare = 2;
                            }

                            return {
                                id: item.id || "",
                                name: item.name || "",
                                category: item.category || "ทั่วไป",
                                unit: item.unit || "หน่วย",
                                count_type: item.count_type ? item.count_type.toString().trim().toLowerCase() : 'both',
                                tare: itemTare,
                                yst: {
                                    full: item.yst?.full ?? 0,
                                    frac: item.yst?.frac ?? 0
                                },
                                today: {
                                    full: item.today?.full ?? "",
                                    frac1: item.today?.frac1 ?? "",
                                    frac2: item.today?.frac2 ?? ""
                                }
                            };
                        });
                        
                        await set(ref(db, `stock_${currentMode}`), formattedData);
                        showCuteModal({ icon: '🎉', title: 'สำเร็จ!', message: 'อัปเดตรายการสินค้าเข้าสู่ระบบเรียบร้อยแล้ว' });
                    }
                } catch (err) {
                    console.error(err);
                    showCuteModal({ icon: '❌', title: 'เกิดข้อผิดพลาด', message: 'ไม่สามารถดึงข้อมูลจาก Sheets ได้ กรุณาลองใหม่อีกครั้ง' });
                }
            };

            if (!isInitial) {
                showCuteModal({
                    icon: '🔄',
                    title: 'ยืนยันการอัปเดต',
                    message: 'ต้องการดึงโครงสร้างรายการสินค้าใหม่จาก Google Sheets ใช่หรือไม่?',
                    showCancel: true,
                    onConfirm: doFetch
                });
            } else {
                doFetch();
            }
        };

        window.switchMode = function(mode) {
            currentMode = mode;
            selectedCategory = 'ทั้งหมด';
            document.getElementById('btnDaily').className = mode === 'daily' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            document.getElementById('btnWeekly').className = mode === 'weekly' ? 'px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-600 text-emerald-600 dark:text-emerald-400 shadow-xs transition' : 'px-3 py-1 text-xs font-medium rounded-md text-slate-500 dark:text-slate-400 transition';
            listenToFirebase();
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'pending', 'done'].forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1)}`);
                if (f === filter) {
                    btn.className = "flex-1 py-1 text-[11px] rounded-lg border bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 font-medium";
                } else {
                    btn.className = "flex-1 py-1 text-[11px] rounded-lg border bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700";
                }
            });
            renderList();
        };

        function getStatusType(item) {
            if (!item || !item.today) return 'empty';
            const f = item.today.full;
            const f1 = item.today.frac1;
            const f2 = item.today.frac2;
            let type = item.count_type || 'both';
            
            let itemTare = parseFloat(item.tare) || 0;
            if (itemTare === 0 && item.name && (item.name.includes('กระปุก') || item.name.includes('กป'))) {
                itemTare = 2;
            }
            const isNeedTare = type === 'frac2' || type === 'both' || itemTare > 0;

            const hasFull = f !== "" && f !== null && f !== undefined;
            const hasFrac1 = f1 !== "" && f1 !== null && f1 !== undefined;
            const hasFrac2 = f2 !== "" && f2 !== null && f2 !== undefined;
            const hasAnyInput = hasFull || hasFrac1 || hasFrac2;

            if (!hasAnyInput) return 'empty'; 

            if (type === 'full') return hasFull ? 'done' : 'incomplete';
            if (type === 'frac') return hasFrac1 ? 'done' : 'incomplete';
            if (type === 'frac2') return (hasFrac1 && hasFrac2) ? 'done' : 'incomplete';
            
            if (type === 'both' || isNeedTare) {
                if (hasFull && (hasFrac1 || hasFrac2)) return 'done';
                return 'incomplete';
            }
            return 'incomplete';
        }

        function updateProgressAndUI() {
            if (stockItems.length === 0) return;
            const total = stockItems.length;
            const completed = stockItems.filter(i => getStatusType(i) === 'done').length;
            const pending = total - completed;
            const percent = Math.round((completed / total) * 100);

            document.getElementById("progressBar").style.width = `${percent}%`;
            document.getElementById("countDone").innerText = completed;
            document.getElementById("countTotal").innerText = total;
            document.getElementById("countPending").innerText = pending;

            if (percent === 100 && lastCompletedCount < total) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
            lastCompletedCount = completed;
        }

        function renderCategories() {
            const container = document.getElementById("categoryContainer");
            if (!container) return;
            container.innerHTML = "";
            const categories = ["ทั้งหมด", ...new Set(stockItems.map(i => i.category || "ทั่วไป"))];

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-2.5 py-1 rounded-lg border text-[11px] whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-800 dark:border-slate-200 font-medium' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`;
                btn.innerText = cat;
                btn.onclick = () => { selectedCategory = cat; renderCategories(); renderList(); };
                container.appendChild(btn);
            });
        }

        window.renderList = function() {
            const container = document.getElementById("stockList");
            if (!container) return;
            container.innerHTML = "";
            const searchVal = document.getElementById("searchInput")?.value.toLowerCase() || "";

            let items = stockItems.filter(item => {
                const itemCat = item.category || "ทั่วไป";
                const matchCategory = selectedCategory === 'ทั้งหมด' || itemCat === selectedCategory;
                const matchSearch = (item.id || "").toLowerCase().includes(searchVal) || (item.name || "").toLowerCase().includes(searchVal);
                if (!matchCategory || !matchSearch) return false;
                
                const status = getStatusType(item);
                if (currentFilter === 'pending') return status === 'empty' || status === 'incomplete';
                if (currentFilter === 'done') return status === 'done';
                return true;
            });

            updateProgressAndUI();

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">ไม่พบรายการสินค้า</div>`;
                return;
            }

            items.forEach((item) => {
                const originalIdx = stockItems.indexOf(item);
                let cleanType = item.count_type || 'both';
                
                let itemTare = parseFloat(item.tare) || 0;
                if (itemTare === 0 && item.name && (item.name.includes('กระปุก') || item.name.includes('กป'))) {
                    itemTare = 2;
                }
                
                const fFullVal = item.today?.full !== "" && item.today?.full !== null ? item.today?.full : 0;
                const f1Val = parseFloat(item.today?.frac1) || 0;
                
                let f2Val = parseFloat(item.today?.frac2) || 0;
                let finalFrac2 = f2Val - itemTare;
                if (finalFrac2 < 0) finalFrac2 = 0;

                const totalFrac = Math.round((f1Val + finalFrac2) * 100) / 100;
                const status = getStatusType(item);

                const isNeedTare = cleanType === 'frac2' || cleanType === 'both' || itemTare > 0;

                const isZeroAll = (item.today?.full === 0 || item.today?.full === "0") && 
                                  (item.today?.frac1 === 0 || item.today?.frac1 === "0") && 
                                  (!isNeedTare || item.today?.frac2 === 0 || item.today?.frac2 === "0");

                let cardBg = 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                let badgeClass = 'text-slate-500 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600';
                let badgeText = '⏳ รอนับ';

                if (status === 'incomplete') {
                    cardBg = 'bg-amber-50/70 dark:bg-amber-950/40 border-2 border-amber-400 dark:border-amber-500';
                    badgeClass = 'text-white bg-amber-500 border border-amber-600 font-bold shadow-xs';
                    badgeText = '⏳ ไม่ครบ';
                } else if (status === 'done') {
                    cardBg = 'bg-emerald-50/80 dark:bg-emerald-950/40 border-2 border-emerald-500 dark:border-emerald-500';
                    badgeClass = 'text-white bg-emerald-600 border border-emerald-700 font-bold shadow-xs';
                    badgeText = '✅ นับเสร็จแล้ว';
                }

                let typeLabel = isNeedTare ? `นับเศษ (ตัดกระปุก -${itemTare})` : (cleanType === 'frac' ? "นับเศษ" : "นับเต็มและเศษ");

                const card = document.createElement("div");
                card.id = `card_${originalIdx}`;
                card.className = `p-3 sm:p-3.5 rounded-xl transition duration-200 shadow-sm ${cardBg}`;
                
                const gridClass = isNeedTare ? "grid-cols-3" : "grid-cols-2";
                const inputStyle = "w-full border-2 border-slate-300 dark:border-slate-500 bg-white dark:bg-slate-950 text-slate-900 dark:text-emerald-400 font-bold text-sm sm:text-base rounded-lg p-1.5 text-center focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none shadow-inner transition";

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div>
                            <div class="flex items-center gap-1 flex-wrap">
                                <span class="font-mono text-[10px] text-slate-600 dark:text-slate-300 bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded font-medium">${item.id}</span>
                                <span class="text-[9px] text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/60 px-1.5 py-0.5 rounded border border-indigo-200 dark:border-indigo-800">📌 ${typeLabel}</span>
                                <span class="text-[9px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700/50 px-1.5 py-0.5 rounded">${item.category || 'ทั่วไป'}</span>
                            </div>
                            <h2 class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white mt-1 leading-snug">${item.name}</h2>
                        </div>
                        <span id="badge_${originalIdx}" class="${badgeClass} text-[10px] px-2.5 py-0.5 rounded-full shrink-0 flex items-center gap-1">
                            ${badgeText}
                        </span>
                    </div>

                    <div class="grid ${gridClass} gap-2 mb-2">
                        <div class="out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <span class="text-[9px] font-semibold text-slate-600 dark:text-slate-300 block mb-0.5">จำนวนเต็ม</span>
                            <input type="number" value="${item.today?.full ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'full', this.value)" class="${inputStyle}" placeholder="0">
                        </div>
                        
                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <div class="flex justify-between items-center mb-0.5">
                                <span class="text-[9px] font-semibold text-slate-600 dark:text-slate-300">${isNeedTare ? 'เศษปกติ' : 'เศษ'}</span>
                                <button onclick="openCalculator(${originalIdx}, 'frac1')" class="text-[10px] hover:scale-110 active:scale-95 transition" title="คำนวณเศษ">🧮</button>
                            </div>
                            <input type="number" value="${item.today?.frac1 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac1', this.value)" class="${inputStyle}" placeholder="0">
                        </div>

                        ${isNeedTare ? `
                        <div class="relative out-of-stock-wrapper ${isZeroAll ? 'sold-out' : ''}">
                            <div class="flex justify-between items-center mb-0.5">
                                <span class="text-[9px] font-semibold text-slate-600 dark:text-slate-300">เศษกระปุก</span>
                                <button onclick="openCalculator(${originalIdx}, 'frac2')" class="text-[10px] hover:scale-110 active:scale-95 transition" title="คำนวณเศษกระปุก">🧮</button>
                            </div>
                            <input type="number" value="${item.today?.frac2 ?? ''}" onchange="updateFirebaseInput(${originalIdx}, 'frac2', this.value)" class="${inputStyle}" placeholder="0">
                        </div>
                        ` : ''}
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center pt-2 border-t border-slate-200 dark:border-slate-700/60 gap-1.5">
                        <div class="flex gap-1.5 shrink-0">
                            <button onclick="setAsYst(${originalIdx})" class="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 px-2 py-0.5 rounded text-[10px] font-medium transition">
                                ↺ ยอดเมื่อวาน
                            </button>
                            <button onclick="setAsZero(${originalIdx})" class="flex-1 sm:flex-none bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 px-2 py-0.5 rounded text-[10px] font-medium transition">
                                ✕ ของหมด (0)
                            </button>
                        </div>
                        
                        <div class="flex items-center justify-between sm:justify-end gap-2 text-[10px] flex-wrap">
                            <span class="text-slate-500 dark:text-slate-400 font-mono text-[9px]">เมื่อวาน: เต็ม ${item.yst?.full ?? 0} | เศษ ${item.yst?.frac ?? 0}</span>
                            <span class="text-emerald-800 dark:text-emerald-300 font-bold bg-emerald-100 dark:bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-300 dark:border-emerald-800 font-mono text-[10px]">
                                ( เต็ม: ${fFullVal} | เศษรวม: ${totalFrac} )
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.updateFirebaseInput = function(idx, field, val) {
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today/${field}`] = val;
            update(ref(db), updates);
        };

        window.setAsYst = function(idx) {
            const item = stockItems[idx];
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: item.yst.full,
                frac1: item.yst.frac,
                frac2: 0
            };
            update(ref(db), updates);
        };

        window.setAsZero = function(idx) {
            const item = stockItems[idx];
            const isCurrentlyZero = item.today?.full === "0" && item.today?.frac1 === "0" && item.today?.frac2 === "0";
            const updates = {};
            updates[`stock_${currentMode}/${idx}/today`] = {
                full: isCurrentlyZero ? "" : "0",
                frac1: isCurrentlyZero ? "" : "0",
                frac2: isCurrentlyZero ? "" : "0"
            };
            update(ref(db), updates);
        };

        window.startNewDay = function() {
            showCuteModal({
                icon: '🌅',
                title: 'เริ่มรอบวันใหม่',
                message: 'ต้องการเริ่มรอบวันใหม่ใช่หรือไม่? (ยอดนับวันนี้จะถูกย้ายเป็นยอดเมื่อวาน)',
                showCancel: true,
                onConfirm: () => {
                    const newItems = stockItems.map(item => {
                        item.yst.full = item.today?.full !== "" && item.today?.full !== null ? item.today.full : item.yst.full;
                        item.today = { full: "", frac1: "", frac2: "" };
                        return item;
                    });
                    set(ref(db, `stock_${currentMode}`), newItems);
                    showCuteModal({ icon: '✨', title: 'สำเร็จ!', message: 'เริ่มรอบวันใหม่เรียบร้อยแล้ว' });
                }
            });
        };

        window.submitToGoogleSheets = async function() {
            if (stockItems.length === 0) {
                showCuteModal({ icon: '⚠️', title: 'ไม่มีข้อมูล', message: 'ไม่พบรายการสินค้าในระบบ' });
                return;
            }

            showCuteModal({
                icon: '📤',
                title: 'ยืนยันการส่งข้อมูล',
                message: `ต้องการเขียนทับข้อมูลลง Google Sheets ทั้งหมด ${stockItems.length} รายการ ตามตำแหน่งบรรทัดใช่หรือไม่?`,
                showCancel: true,
                onConfirm: async () => {
                    showCuteModal({ icon: '⏳', title: 'กำลังส่งข้อมูล', message: 'กำลังบันทึกข้อมูลลง Google Sheets...' });
                    try {
                        const response = await fetch(WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ mode: currentMode, items: stockItems })
                        });
                        const result = await response.json();
                        
                        if (result.status === 'success') {
                            showCuteModal({ icon: '🎉', title: 'สำเร็จ!', message: 'บันทึกข้อมูลลง Google Sheets เรียบร้อยแล้วค่ะ' });
                        } else {
                            showCuteModal({ icon: '❌', title: 'เกิดข้อผิดพลาด', message: result.message || 'ไม่สามารถส่งข้อมูลได้' });
                        }
                    } catch (error) {
                        showCuteModal({ icon: '❌', title: 'เกิดข้อผิดพลาด', message: 'ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต' });
                    }
                }
            });
        };

        window.toggleMenu = function() {
            const drawer = document.getElementById('menuDrawer');
            drawer.classList.toggle('hidden');
        };

        initTheme();
        listenToFirebase();
    </script>
